# Produção: soma-se ao docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# O Caddy recebe o tráfego da internet, emite o certificado HTTPS sozinho (Let's Encrypt)
# e pede usuário e senha para tudo, menos a verificação pública de laudos.
services:
  api:
    environment:
      URL_PUBLICA: https://${DOMINIO:?defina DOMINIO no .env}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
      ACESSO_USUARIO: ${ACESSO_USUARIO:?defina ACESSO_USUARIO no .env}
      ACESSO_SENHA_HASH: ${ACESSO_SENHA_HASH:?defina ACESSO_SENHA_HASH no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config

volumes:
  caddy_dados:
  caddy_config:
