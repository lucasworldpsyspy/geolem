name: geolem

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geolem}
      POSTGRES_USER: ${POSTGRES_USER:-geolem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geolem}
    ports:
      - "127.0.0.1:${DB_PORTA:-5432}:5432"  # só no próprio computador, nunca exposto à rede
    volumes:
      - dados_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geolem}:${POSTGRES_PASSWORD:-geolem}@db:5432/${POSTGRES_DB:-geolem}
      REGIAO_BBOX: ${REGIAO_BBOX:--46.7,-12.9,-45.0,-11.3}
      AREA_MINIMA_HA: ${AREA_MINIMA_HA:-0.1}
      WEB_DIR: /app/web
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8000}
      IMAGENS_SATELITE: ${IMAGENS_SATELITE:-1}
    ports:
      - "127.0.0.1:${API_PORTA:-8000}:8000"  # em produção, o acesso externo passa pelo Caddy (HTTPS)
    volumes:
      - ./web:/app/web:ro
      - ./dados:/app/dados

  # Processa a fila da carteira (análises em lote e monitoramento semanal) e envia os alertas por e-mail
  worker:
    build: ./api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geolem}:${POSTGRES_PASSWORD:-geolem}@db:5432/${POSTGRES_DB:-geolem}
      AREA_MINIMA_HA: ${AREA_MINIMA_HA:-0.1}
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8000}
      IMAGENS_SATELITE: ${IMAGENS_SATELITE:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}

volumes:
  dados_db:
